pre-commit:
  parallel: true
  commands:
    format:
      run: bun run format:check
    lint:
      run: bun run lint
    typecheck:
      run: bun run typecheck
commit-msg:
  commands:
    attribution:
      run: "! grep -qiE 'co-authored-by: *(claude|.*anthropic)|generated with .*claude' {1}"
pre-push:
  commands:
    test:
      run: bun run test
